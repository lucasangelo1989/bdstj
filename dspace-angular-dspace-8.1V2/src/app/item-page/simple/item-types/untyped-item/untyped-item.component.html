<ds-results-back-button *ngIf="showBackButton$ | async" [back]="back"></ds-results-back-button>
<div class="row" *ngIf="iiifEnabled">
  <div class="col-12">
    <ds-mirador-viewer id="iiif-viewer"
                   [object]="object"
                   [searchable]="iiifSearchEnabled"
                   [query]="iiifQuery$ | async">
    </ds-mirador-viewer>
  </div>
</div>

<div class="d-flex flex-column">
  <ds-item-page-title-field [item]="object" class="mb-2">
  </ds-item-page-title-field>
  <ds-generic-item-page-field [item]="object"
    [fields]="['dc.description.status']"
    [label]="'item.page.description.status'"
    class="mb-2">
  </ds-generic-item-page-field>
  <ds-dso-edit-menu></ds-dso-edit-menu>
</div>

<div class="row">
  <div class="col-xs-12 col-md-4 publicacao-dados mt-3">
    <ng-container *ngIf="!(mediaViewer.image || mediaViewer.video)">
      <ds-metadata-field-wrapper [hideIfNoTextContent]="false">
        <div class="publicacao-capa">
          <ds-thumbnail [thumbnail]="object?.thumbnail | async"></ds-thumbnail>
        </div>
      </ds-metadata-field-wrapper>
    </ng-container>
    <div *ngIf="mediaViewer.image || mediaViewer.video" class="mb-2">
      <ds-media-viewer [item]="object"></ds-media-viewer>
    </div>

 <ds-item-page-file-section [item]="object"></ds-item-page-file-section>


    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.date.issued']"
      [label]="'item.page.date.issued'">
    </ds-generic-item-page-field>

    <ds-metadata-representation-list class="ds-item-page-mixed-author-field"
      [parentItem]="object"
      [itemType]="'Person'"
      [metadataFields]="['dc.contributor.author']"
      [label]="'item.author' | translate">
    </ds-metadata-representation-list>

     <ds-metadata-representation-list class="ds-item-page-mixed-author-field"
      [parentItem]="object"
      [itemType]="'Person'"
      [metadataFields]="['dc.creator']"
      [label]="'item.creator' | translate">
    </ds-metadata-representation-list>
  <ds-item-page-collections [item]="object"></ds-item-page-collections>

  <div>
    <a class="btn btn-outline-primary" [routerLink]="[itemPageRoute + '/full']" role="button">
      <i class="fas fa-info-circle"></i> {{"item.page.link.full" | translate}}
    </a>
  </div>


  </div> <!-- lado esquerdo-->


  <div class="col-xs-12 col-md-6 publicacao">

     <ds-related-items
       [parentItem]="object"
       [relationType]="'isVolumeOfJournal'"
       [label]="'Edições'">
    </ds-related-items>

    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.identifier.uri']"
      [label]="'item.page.uri2'">
    </ds-generic-item-page-field>


    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.relation.isversionof']"
      [label]="'item.page.relation.isversionof'">
    </ds-generic-item-page-field>

    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.publisher']"
      [label]="'item.page.publisher'">
    </ds-generic-item-page-field>
 <ds-generic-item-page-field [item]="object"
      [fields]="['dc.identifier.citation']"
      [label]="'item.page.citation'">
    </ds-generic-item-page-field>

    <ds-item-page-abstract-field [item]="object"></ds-item-page-abstract-field>

    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.description']"
      [label]="'item.page.description2'">
    </ds-generic-item-page-field>

    <ds-generic-item-page-field [item]="object"
      [fields]="['dc.description.notes']"
      [label]="'item.page.description.notes'">
    </ds-generic-item-page-field>



   <div *ngIf="relatedItems.length > 0" class="simple-view-element">
  		<h2 class="simple-view-element-header ng-star-inserted">Itens Relacionados</h2>
  		<ul>
    			<li *ngFor="let item of relatedItems.slice(0, showAll ? relatedItems.length : 3)">
      				<a [href]="item.link" target="_blank">{{ item.title }}</a>
    			</li>	
  		</ul>
  		<div *ngIf="relatedItems.length > 3" class="mt-1">
    			<button class="btn btn-outline-secondary btn-sm" (click)="toggleShowAll()">
      				{{ showAll ? 'Ver menos' : 'Ver mais' }}
   			</button>
  		</div>
  </div>
	

</div> <!-- fim lado direito-->

</div>
